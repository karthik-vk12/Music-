
name: Build KAEL Music APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android project
        run: |
          unzip -q vivin.zip -d extracted
          echo "Extracted project files:"
          find extracted -maxdepth 5 -name gradlew

      - name: Find Android project
        id: project
        run: |
          GRADLEW=$(find extracted -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No gradlew found in vivin.zip"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KAEL-Music-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
